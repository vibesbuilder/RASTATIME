# RASTATIME 2026-10-04 (go-live stage 1) - listener streams through Apache.
#
# The stream outputs (Settings -> Streams) publish their listener URL as
# <public_url>/stream/<mount>; Apache hands /stream/ to the local Icecast
# so the same address works in the LAN and on the internet and port 8000
# never has to be forwarded.  Included from the :80 server (httpd.conf)
# AND from the TLS virtual host (rastatime-https.conf) - ProxyPass is not
# inherited by virtual hosts.
#
#   Include "C:/RASTATIME/infra/apache/rastatime-stream-proxy.conf"
#
# Requires mod_proxy, mod_proxy_http and mod_headers (loaded in httpd.conf).

<IfModule proxy_module>
    # Only the mounts go through; Icecast's status pages, playlists and
    # admin stay internal (evaluated before the proxy below).
    <LocationMatch "^/stream/(admin|status|status-json\.xsl|server_version\.xsl|.*\.(m3u|xspf|vclt))$">
        Require all denied
    </LocationMatch>

    <Location "/stream/">
        # retry=0: a restarting Icecast is retried on the next request,
        # not blacklisted for 60 s.  timeout: a mount that sends nothing
        # for 30 s is dead for the listener anyway.
        ProxyPass "http://127.0.0.1:8000/" retry=0 timeout=30
        ProxyPassReverse "http://127.0.0.1:8000/"
        # a live stream must never be cached or sniffed in between
        Header always set Cache-Control "no-cache, no-store"
        Header always set X-Content-Type-Options "nosniff"
        Require all granted
    </Location>
</IfModule>
