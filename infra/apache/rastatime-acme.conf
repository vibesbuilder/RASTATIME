# RASTATIME 2026-10-04 (go-live stage 1) - Let's Encrypt HTTP-01 challenge
# directory for win-acme (validation plugin "filesystem", path
# C:\RASTATIME\acme).  The legacy front controller rewrites every unknown
# path to index.php; the Alias wins over DocumentRoot mapping, and the
# directory below switches the rewrite engine off, so the token files are
# served as plain files on :80 (and on :443 once that host exists).
#
#   httpd.conf:  Include "C:/RASTATIME/infra/apache/rastatime-acme.conf"
#
# C:\RASTATIME\acme is git-ignored; create it before the first run.

Alias "/.well-known/acme-challenge/" "C:/RASTATIME/acme/.well-known/acme-challenge/"
<Directory "C:/RASTATIME/acme/.well-known/acme-challenge">
    Options None
    AllowOverride None
    Require all granted
    <IfModule rewrite_module>
        RewriteEngine Off
    </IfModule>
    # tokens are plain text, never cached
    Header always set Cache-Control "no-store"
    ForceType text/plain
</Directory>
