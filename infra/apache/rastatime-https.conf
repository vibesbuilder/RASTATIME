# RASTATIME 2026-10-04 (go-live stage 1, way A) - the public TLS virtual
# host of the station (public name from config/apache-site.conf).
#
# Enable only after win-acme has written the certificate files (stage 2,
# docs/operator/GO_LIVE_HTTPS.md):
#
#   httpd.conf:  LoadModule ssl_module modules/mod_ssl.so
#                LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
#                LoadModule http2_module modules/mod_http2.so
#                (mod_headers, mod_rewrite, mod_proxy, mod_proxy_http are
#                already loaded)
#                Include "C:/RASTATIME/infra/apache/rastatime-https.conf"
#
# The <Directory "C:/RASTATIME/frontend/legacy/public"> block of httpd.conf
# (index.php front controller, Authorization header) is global and applies
# here as well; only server-level directives (proxies, headers) are
# repeated because virtual hosts do not inherit them.

# RASTATIME 2026-11-02 - the public host name and the certificate folder
# live in the git-ignored config/apache-site.conf (template:
# config/apache-site.conf.example; the backup ZIP takes it along with the
# other files of config/), so this file carries no station data.
Include "C:/RASTATIME/config/apache-site.conf"

Listen 443

# --- HTTP -> HTTPS for the public name only -------------------------------
# Requests that arrive by the public host name on plain http are sent to
# https (search engines, old bookmarks).  The LAN address keeps plain http
# unchanged, and the ACME challenge path must stay reachable on :80.
<IfModule rewrite_module>
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteCond %{HTTP_HOST} =${RT_PUBLIC_HOST} [NC]
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://${RT_PUBLIC_HOST}%{REQUEST_URI} [R=301,L]
</IfModule>

# --- TLS defaults (Mozilla "intermediate", 2026) --------------------------
SSLProtocol             -all +TLSv1.2 +TLSv1.3
SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
SSLHonorCipherOrder     off
SSLSessionTickets       off
<IfModule socache_shmcb_module>
    SSLSessionCache     "shmcb:${SRVROOT}/logs/ssl_scache(512000)"
    SSLSessionCacheTimeout 300
</IfModule>
# OCSP stapling off: Let's Encrypt ended OCSP, certificates issued since the
# 2026-10-18 renewal carry no OCSP responder URI, so stapling only logged
# AH02218/AH02604 on every start.  Revocation now goes through CRLs.
SSLUseStapling          off

# RASTATIME 2026-11-02 - the public server tells no versions: "Server:
# Apache" only (default Full also named OS, OpenSSL and mod_fcgid), no
# signature on error pages.  Server-wide directives, they apply to :80 too.
ServerTokens            Prod
ServerSignature         Off

<VirtualHost *:443>
    ServerName ${RT_PUBLIC_HOST}
    DocumentRoot "C:/RASTATIME/frontend/legacy/public"

    SSLEngine on
    # win-acme, store plugin "pemfiles" -> <name>-chain.pem (certificate +
    # intermediates) and <name>-key.pem; renewed in place every ~60 days,
    # Apache is restarted by the win-acme installation script step.
    SSLCertificateFile    "${RT_CERT_DIR}/${RT_PUBLIC_HOST}-chain.pem"
    SSLCertificateKeyFile "${RT_CERT_DIR}/${RT_PUBLIC_HOST}-key.pem"

    <IfModule http2_module>
        Protocols h2 http/1.1
    </IfModule>

    # The legacy PHP sees HTTPS=on natively (secure session cookie); the
    # Django API behind the proxy learns the scheme from this header.
    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # RASTATIME 2026-11-02 - the studio interface is a tool, not a
    # website: search engines leave it out (the station's own website is
    # what listeners find), and PHP does not announce its version.
    Header always set X-Robots-Tag "noindex, nofollow"
    Header unset X-Powered-By
    Header always unset X-Powered-By

    # --- same proxies as the :80 server (not inherited) -------------------
    ProxyPreserveHost On
    ProxyPass        /api/v2/   http://127.0.0.1:8765/api/v2/
    ProxyPassReverse /api/v2/   http://127.0.0.1:8765/api/v2/
    ProxyPass        /api-auth/ http://127.0.0.1:8765/api-auth/
    ProxyPassReverse /api-auth/ http://127.0.0.1:8765/api-auth/
    Include "C:/RASTATIME/infra/apache/rastatime-stream-proxy.conf"
    Include "C:/RASTATIME/infra/apache/rastatime-acme.conf"

    # RASTATIME 2026-10-09 - daily slices through rotatelogs: Apache keeps a
    # plain log file open and locked, so the log janitor could never sweep
    # https-error.log (100 MB after four days of PHP deprecation noise, now
    # silenced in airtime-boot.php).  A finished slice is an ordinary file
    # the janitor archives after 7 days; the firewall watcher reads the
    # slices of today and yesterday.
    ErrorLog  "|C:/Tools/Apache24/bin/rotatelogs.exe -l C:/RASTATIME/logs/https-error-%Y%m%d.log 86400"
    CustomLog "|C:/Tools/Apache24/bin/rotatelogs.exe -l C:/RASTATIME/logs/https-access-%Y%m%d.log 86400" combined
</VirtualHost>
