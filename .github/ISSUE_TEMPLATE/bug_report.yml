name: Bug report
description: Something in RASTATIME does not behave as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.  Security problems go through **Security → Report a vulnerability**, not here (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit hash (`git rev-parse --short HEAD`), and the Windows build.
      placeholder: v1.0.0 / 7f4c4ed2, Windows 11 Pro 24H2
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web interface (legacy PHP frontend)
        - API (Django)
        - Playout / Liquidsoap
        - Analyzer / uploads / imports
        - Icecast / stream outputs / DJ login
        - Worker (podcasts, cleanup)
        - Install / NSSM scripts / documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Settings → Streams → …
        2. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Relevant lines from `logs\` (api-stdout, playout-stdout, liquidsoap-stdout, http-error-*, legacy.log). **Remove passwords and API keys.**
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `powershell -File infra\nssm\status.ps1` and the versions of PHP, PostgreSQL, Liquidsoap and Icecast if they differ from `docs/operator/INSTALL.md`.
      render: text
