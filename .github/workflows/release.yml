# RASTATIME — release workflow
#
# Triggered by pushing a Git tag of the form v*.*.* (e.g. v0.1.0).
# Builds Python wheels for every backend package, packages the legacy
# PHP frontend as a zip, then attaches everything to a fresh GitHub
# release whose body comes straight from the matching CHANGELOG.md
# section.
#
# Workflow:
#
#   git tag v0.1.0
#   git push origin v0.1.0           # CI builds and releases automatically
#
# To re-run a release manually (e.g. after fixing a build hiccup), use
# the "Run workflow" button in Actions → release; it accepts an explicit
# tag name as input.  "dry_run" builds and collects everything and lists
# the files, but publishes nothing - the test after updating the actions.
# No job pushes, so checkout keeps the token out of .git/config
# (persist-credentials: false).

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
      dry_run:
        description: "Build and collect everything, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write   # needed by softprops/action-gh-release

jobs:
  # ------------------------------------------------------------------
  # Build the five backend Python wheels in parallel (the worker is a
  # placeholder without a setup.py).  Each wheel is uploaded as an
  # artifact so the release job can collect them.
  # ------------------------------------------------------------------
  wheels:
    name: build wheel (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [analyzer, api, api-client, playout, shared]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build wheel
        working-directory: backend/${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.package }}
          path: backend/${{ matrix.package }}/dist/*.whl
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Bundle the legacy PHP frontend as a zip for operators who want a
  # one-shot drop into Apache's DocumentRoot.  vendor/ is included so
  # the target machine does not need composer.
  # ------------------------------------------------------------------
  frontend-zip:
    name: zip legacy frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: composer install (no-dev)
        working-directory: frontend/legacy
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Create zip
        run: |
          mkdir -p out
          ( cd frontend && zip -qr "../out/rastatime-frontend-legacy-${{ inputs.tag || github.ref_name }}.zip" legacy \
              -x "legacy/tests/*" \
                 "legacy/.git/*" \
                 "legacy/log/*" )

      - name: Upload frontend zip artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-zip
          path: out/*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Cut the GitHub release.  Pulls the matching CHANGELOG.md section
  # so the operator does not need to copy-paste release notes by hand.
  # ------------------------------------------------------------------
  release:
    name: publish GitHub release
    needs: [wheels, frontend-zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes (docs/releases/<tag>.md, else CHANGELOG.md)
        id: notes
        run: |
          tag="${{ steps.tag.outputs.name }}"
          # Curated notes win: the CHANGELOG section of a big release is far
          # too long for a GitHub release body (v1.0.0 carries the whole
          # history since the fork).
          if [ -s "docs/releases/${tag}.md" ]; then
            cp "docs/releases/${tag}.md" release-notes.md
            echo "Using docs/releases/${tag}.md"
            exit 0
          fi
          # Strip the leading "v" so the heading matches "## [0.1.0] - ..."
          version="${tag#v}"
          # Pull everything from "## [<version>]" up to the next "## ["
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; print; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for ${version}; using a placeholder."
            echo "Release ${version}." > release-notes.md
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      # ls fails when a pattern matches nothing: no release without its
      # wheels and the frontend zip, in a dry run as well
      - name: List release files
        run: ls -l artifacts/*.whl artifacts/*.zip

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: release-notes.md
          files: |
            artifacts/*.whl
            artifacts/*.zip
          fail_on_unmatched_files: true
