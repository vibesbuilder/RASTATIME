# RASTATIME — release workflow
#
# Triggered by pushing a Git tag of the form v*.*.* (e.g. v0.1.0).
# Builds Python wheels for every backend package, packages the legacy
# PHP frontend as a zip, then attaches everything to a fresh GitHub
# release whose body comes straight from the matching CHANGELOG.md
# section.
#
# Workflow:
#
#   git tag v0.1.0
#   git push origin v0.1.0           # CI builds and releases automatically
#
# To re-run a release manually (e.g. after fixing a build hiccup), use
# the "Run workflow" button in Actions → release; it accepts an explicit
# tag name as input.

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write   # needed by softprops/action-gh-release

jobs:
  # ------------------------------------------------------------------
  # Build all six backend Python wheels in parallel.  Each wheel is
  # uploaded as an artifact so the release job can collect them.
  # ------------------------------------------------------------------
  wheels:
    name: build wheel (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [analyzer, api, api-client, playout, shared, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        working-directory: backend/${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.package }}
          path: backend/${{ matrix.package }}/dist/*.whl
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Bundle the legacy PHP frontend as a zip for operators who want a
  # one-shot drop into Apache's DocumentRoot.  vendor/ is included so
  # the target machine does not need composer.
  # ------------------------------------------------------------------
  frontend-zip:
    name: zip legacy frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: composer install (no-dev)
        working-directory: frontend/legacy
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Create zip
        run: |
          mkdir -p out
          ( cd frontend && zip -qr "../out/rastatime-frontend-legacy-${{ github.ref_name }}.zip" legacy \
              -x "legacy/tests/*" \
                 "legacy/.git/*" \
                 "legacy/log/*" )

      - name: Upload frontend zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-zip
          path: out/*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Cut the GitHub release.  Pulls the matching CHANGELOG.md section
  # so the operator does not need to copy-paste release notes by hand.
  # ------------------------------------------------------------------
  release:
    name: publish GitHub release
    needs: [wheels, frontend-zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          # Strip the leading "v" so the heading matches "## [0.1.0] - ..."
          version="${{ steps.tag.outputs.name }}"
          version="${version#v}"
          # Pull everything from "## [<version>]" up to the next "## ["
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; print; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for ${version}; using a placeholder."
            echo "Release ${version}." > release-notes.md
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: release-notes.md
          files: |
            artifacts/*.whl
            artifacts/*.zip
          fail_on_unmatched_files: false
