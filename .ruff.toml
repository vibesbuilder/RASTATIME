# RASTATIME — repo-wide Ruff configuration.
#
# "Mittel"-Strenge: lint and format checks are hard-fails for all
# code under backend/, but legacy upstream snapshots and vendored
# fixtures are excluded so we do not have to chase obsolete style.

line-length = 100
target-version = "py311"

extend-exclude = [
    # Vendored / generated / upstream snapshots
    "infra/upstream",
    "**/migrations/sql",
    "**/__pycache__",
    "**/.venv",
    "**/build",
    "**/dist",
    "**/*.egg-info",
    # Legacy frontend is PHP — no Python here, but be defensive
    "frontend/legacy",
    # Django migrations are generated code; left as written (2026-11-01)
    "**/migrations",
]

[lint]
# "Mittel": pyflakes (F), pycodestyle errors (E), import sort (I),
# bugbear lite (B), and pyupgrade (UP) — strong on real bugs, lenient
# on stylistic noise.  Skip the full PEP8 (W) and naming (N) checks
# so Liquidsoap-fork inheritance does not generate hundreds of nags.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # line-too-long — handled by ruff-format
    "B008",   # function-call-in-default — common in FastAPI/click handlers
    "B904",   # raise-from — a lot of legacy code does plain raise
    "UP007",  # `Optional[X]` — keep until we drop Python 3.9 support upstream
    "UP045",  # idem
    "UP042",  # (str, Enum) -> StrEnum changes str() of the members; the
              # playout/telnet protocol and the config models rely on it (2026-11-01)
    "B027",   # empty methods in the engine ABC are deliberate no-op defaults
]

[lint.per-file-ignores]
# Tests can be looser
"**/tests/**" = ["B", "F401", "E402"]
"**/conftest.py" = ["F401"]
# CLI entry points often need top-level side effects
"**/__main__.py" = ["E402"]
# re-export modules: the imports are the public surface (2026-11-01)
"**/__init__.py" = ["F401"]
"**/settings/*.py" = ["F401"]

[format]
# Match existing repo conventions
quote-style = "double"
indent-style = "space"
